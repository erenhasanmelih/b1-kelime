name: Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Sürüm numarası
        id: ver
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VERSION="$BASE.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          sed -i "s/const VERSION = '[^']*';/const VERSION = '$VERSION';/" www/app.js
          grep -n "const VERSION" www/app.js

      - run: npm ci
      - run: npx cap sync android

      - name: İmza anahtarı
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "KEYSTORE_BASE64 secret eksik"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: APK oluştur
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.ver.outputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/B1-Kelime.apk"

      - name: Release yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: B1 Kelime v${{ steps.ver.outputs.version }}
          make_latest: true
          files: B1-Kelime.apk
          body: |
            📲 **Kurulum:** Telefonda aşağıdaki **B1-Kelime.apk** dosyasına dokun → indir → aç → **Yükle**.
            İlk kurulumda Android "bilinmeyen uygulamalar" izni ister: Chrome için **Bu kaynaktan izin ver** seçeneğini aç.

            🔄 **Güncelleme:** Yeni sürüm çıkınca uygulama açılışta haber verir. İlerleme → **İndir** ile yeni APK'yı kur; ilerlemen silinmez.
